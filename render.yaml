services:
  - type: web
    name: pak-license-server
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: SERVER_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: Abozain
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_TIMEOUT
        value: 300
      - key: DB_PATH
        value: /var/data/licenses.db
      - key: SECRET_KEY
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
